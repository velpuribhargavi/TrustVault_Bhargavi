services:
  - type: web
    name: trustvault
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # The app reads every setting with the TRUSTVAULT_ prefix (see trustvault/config.py).
      # Render generates a random base64 256-bit value, which is the format the keys need.
      - key: TRUSTVAULT_MASTER_KEY
        generateValue: true
      - key: TRUSTVAULT_AUDIT_KEY
        generateValue: true
      # Render serves the site over HTTPS behind its own proxy.
      - key: TRUSTVAULT_COOKIE_SECURE
        value: "1"
      - key: TRUSTVAULT_TRUST_PROXY
        value: "1"
