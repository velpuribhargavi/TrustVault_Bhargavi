<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Shared document - TrustVault</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="share-page">
  <main class="share-card" id="share">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TrustVault</div>
    <h1 id="share-title">Shared document</h1>
    <p id="share-status" class="muted">Checking link…</p>
    <dl id="share-meta" class="meta hidden"></dl>
    <button id="share-download" class="btn primary hidden" type="button">Download</button>
    <p class="fineprint">Every use of this link is recorded. The owner can revoke it at any time.</p>
  </main>
  <script src="/static/share.js"></script>
</body>
</html>
